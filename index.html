<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Telegram Gift Case Game</title>
    <!-- Telegram WebApp SDK с защитой от таймаута в обычном браузере -->
    <script src="https://telegram.org/js/telegram-web-app.js" async onerror="console.log('Telegram SDK не загружен')"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f0f11;
            color: #ffffff;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            width: 100vw;
            height: 100dvh;
            background: #18181b;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #202024;
            border-bottom: 1px solid #27272a;
            flex-shrink: 0;
        }
        .header-title {
            font-size: 15px;
            font-weight: 600;
            color: #a78bfa;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60%;
        }
        .balance-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .balance-box {
            background: #27272a;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .add-stars-btn {
            background: #a78bfa;
            color: #18181b;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background 0.2s;
        }
        .add-stars-btn:active {
            transform: scale(0.9);
        }
        .content {
            flex: 1;
            position: relative;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }
        .screen.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .nav-bar {
            display: flex;
            background: #202024;
            border-top: 1px solid #27272a;
            height: calc(60px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            flex-shrink: 0;
        }
        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            color: #71717a;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }
        .nav-btn span.icon {
            font-size: 20px;
            position: relative;
        }
        .nav-btn.active {
            color: #a78bfa;
            background: #27272a55;
        }
        .badge-dot {
            position: absolute;
            top: -2px;
            right: -6px;
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            border: 2px solid #202024;
            display: none;
            box-shadow: 0 0 8px #ef4444;
        }
        .badge-dot.active {
            display: block;
        }
        .roulette-switcher {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            width: 100%;
            max-width: 400px;
        }
        .switch-tab {
            flex: 1;
            background: #27272a;
            border: 1px solid #3f3f46;
            color: #a1a1aa;
            padding: 10px 6px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .switch-tab.active {
            background: #8b5cf6;
            color: #ffffff;
            border-color: #a78bfa;
        }
        .case-card {
            background: #202024;
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .roulette-container {
            position: relative;
            width: 100%;
            height: 105px;
            background: #111113;
            border: 2px solid #3f3f46;
            border-radius: 12px;
            overflow: hidden;
            margin: 12px 0;
        }
        .roulette-pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 100%;
            background: #ef4444;
            z-index: 10;
            box-shadow: 0 0 10px #ef4444;
        }
        .roulette-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            will-change: transform;
        }
        .roulette-item {
            min-width: 85px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #18181b;
            border-right: 1px solid #27272a;
            font-size: 28px;
        }
        .roulette-item span.label {
            font-size: 9px;
            color: #a1a1aa;
            margin-top: 3px;
        }
        .btn {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            width: 100%;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            background: #3f3f46;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .withdraw-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            width: 100%;
        }
        .sell-btn {
            background: #f59e0b;
            color: #18181b;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            width: 100%;
        }
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 400px;
            max-height: 100%;
            overflow-y: auto;
            padding: 4px;
        }
        .inventory-item {
            background: #202024;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            text-align: center;
        }
        .inventory-item span.item-name {
            font-size: 11px;
            color: #a1a1aa;
            margin-top: 3px;
        }
        .empty-inv {
            color: #71717a;
            font-size: 13px;
            text-align: center;
            grid-column: span 3;
            padding: 40px 10px;
        }
        .profile-card {
            background: #202024;
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 18px;
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }
        .input-group label {
            font-size: 11px;
            color: #a1a1aa;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-group input {
            background: #18181b;
            border: 1px solid #3f3f46;
            padding: 9px 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            flex: 1;
        }
        .input-group input:focus {
            border-color: #8b5cf6;
            outline: none;
        }
        .input-group input[readonly] {
            background: #111113;
            color: #71717a;
            border-color: #27272a;
        }
        .copy-btn {
            background: #27272a;
            color: #a78bfa;
            border: 1px solid #3f3f46;
            padding: 0 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .link-btn {
            display: block;
            background: #27272a;
            color: #a78bfa;
            text-decoration: none;
            padding: 11px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid #3f3f46;
            cursor: pointer;
        }
        .admin-btn {
            background: #27272a;
            color: #ef4444;
            border: 1px solid #ef444455;
            padding: 9px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .deposit-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 12px 0;
        }
        .deposit-option-btn {
            background: #18181b;
            border: 1px solid #3f3f46;
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .deposit-info-box {
            background: #18181b;
            border: 1px solid #8b5cf6;
            padding: 12px;
            border-radius: 10px;
            color: #d8b4fe;
            font-size: 13px;
            margin: 10px 0;
            display: none;
            text-align: center;
        }
        .deposit-link-clickable {
            color: #a78bfa;
            font-weight: 700;
            text-decoration: underline;
            cursor: pointer;
            display: inline-block;
            margin-top: 6px;
        }
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.2s ease;
        }
        .modal-card {
            background: #202024;
            border: 1px solid #3f3f46;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            max-width: 320px;
            width: 88%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
        }
        .modal-close-cross {
            position: absolute;
            top: 10px;
            right: 14px;
            font-size: 18px;
            color: #a1a1aa;
            cursor: pointer;
            padding: 4px;
        }
        .modal-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .modal-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .modal-desc {
            font-size: 12px;
            color: #a1a1aa;
            margin-bottom: 12px;
        }
        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .close-btn {
            background: #27272a;
            color: #a1a1aa;
            border: 1px solid #3f3f46;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header">
        <div class="header-title" id="header-username">🎁 Игрок Telegram</div>
        <div class="balance-container">
            <div class="balance-box">
                ⭐ <span id="user-stars">50</span>
            </div>
            <button class="add-stars-btn" onclick="openDepositModal()" title="Пополнить баланс">+</button>
        </div>
    </div>

    <!-- Content Screens -->
    <div class="content">
        <!-- Main Menu / Roulette Screen -->
        <div class="screen active" id="screen-main">
            <div class="roulette-switcher">
                <button class="switch-tab active" id="tab-paid" onclick="switchRouletteMode('paid')">🎁 Кейс (25 ⭐)</button>
                <button class="switch-tab" id="tab-free" onclick="switchRouletteMode('free')">⭐ FREE Кейс</button>
            </div>

            <div class="case-card">
                <h2 style="font-size: 17px; margin-bottom: 4px;" id="case-title">Подарочный кейс</h2>
                <p style="font-size: 11px; color: #a1a1aa; margin-bottom: 8px;" id="case-desc">Испытай удачу и выиграй эксклюзивный подарок!</p>
