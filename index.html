<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Telegram Gift Case Game (PvP Dual Roulettes)</title>
    <script src="https://telegram-duel-server-t0w9.onrender.com/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0f0f11; color: #ffffff; }
        body { display: flex; justify-content: center; align-items: center; }
        .app-container { width: 100vw; height: 100dvh; background: #18181b; display: flex; flex-direction: column; position: relative; overflow: hidden; padding-top: env(safe-area-inset-top); }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #202024; border-bottom: 1px solid #27272a; flex-shrink: 0; }
        .header-title { font-size: 15px; font-weight: 600; color: #a78bfa; }
        .balance-container { display: flex; align-items: center; gap: 8px; }
        .balance-box { background: #27272a; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #fbbf24; }
        .add-stars-btn { background: #a78bfa; color: #18181b; border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 18px; font-weight: bold; cursor: pointer; }
        .content { flex: 1; position: relative; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; animation: fadeIn 0.25s ease; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .nav-bar { display: flex; background: #202024; border-top: 1px solid #27272a; height: calc(60px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; }
        .nav-btn { flex: 1; background: none; border: none; color: #71717a; font-size: 11px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; }
        .nav-btn.active { color: #a78bfa; background: #27272a55; }
        .badge-dot { position: absolute; top: -2px; right: -6px; width: 10px; height: 10px; background-color: #ef4444; border-radius: 50%; display: none; }
        .badge-dot.active { display: block; }
        .roulette-switcher { display: flex; gap: 8px; margin-bottom: 12px; width: 100%; max-width: 400px; }
        .switch-tab { flex: 1; background: #27272a; border: 1px solid #3f3f46; color: #a1a1aa; padding: 10px 6px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .switch-tab.active { background: #8b5cf6; color: #ffffff; border-color: #a78bfa; }
        .case-card { background: #202024; border: 1px solid #27272a; border-radius: 16px; padding: 16px; text-align: center; max-width: 400px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        
        /* Стили рулеток */
        .roulette-container { position: relative; width: 100%; height: 90px; background: #111113; border: 2px solid #3f3f46; border-radius: 12px; overflow: hidden; margin: 8px 0; }
        .roulette-pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 3px; height: 100%; background: #ef4444; z-index: 10; box-shadow: 0 0 10px #ef4444; }
        .roulette-track { display: flex; position: absolute; left: 0; top: 0; height: 100%; will-change: transform; }
        .roulette-item { min-width: 75px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #18181b; border-right: 1px solid #27272a; font-size: 24px; }
        .roulette-item span.label { font-size: 9px; color: #a1a1aa; margin-top: 2px; }

        .btn { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 8px; }
        .btn:disabled { background: #3f3f46; cursor: not-allowed; opacity: 0.7; }
        .inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 400px; max-height: 100%; overflow-y: auto; padding: 4px; }
        .inventory-item { background: #202024; border: 1px solid #27272a; border-radius: 12px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 26px; text-align: center; }
        .inventory-item span.item-name { font-size: 11px; color: #a1a1aa; margin-top: 3px; }
        .empty-inv { color: #71717a; font-size: 13px; text-align: center; grid-column: span 3; padding: 40px 10px; }
        .profile-card { background: #202024; border: 1px solid #27272a; border-radius: 16px; padding: 18px; max-width: 400px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-card { background: #202024; border: 1px solid #3f3f46; border-radius: 20px; padding: 20px; text-align: center; max-width: 320px; width: 88%; position: relative; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="header-title" id="header-username">🎁 Игрок</div>
        <div class="balance-container">
            <div class="balance-box">⭐ <span id="user-stars">50</span></div>
            <button class="add-stars-btn" onclick="openDepositModal()">+</button>
        </div>
    </div>

    <div class="content">
        <div class="screen active" id="screen-main">
            <div class="roulette-switcher">
                <button class="switch-tab active" id="tab-paid" onclick="switchRouletteMode('paid')">🎁 Кейс (25 ⭐)</button>
                <button class="switch-tab" id="tab-duel" onclick="switchRouletteMode('duel')">⚔️ Дуэль (25 ⭐)</button>
                <button class="switch-tab" id="tab-free" onclick="switchRouletteMode('free')">⭐ FREE Кейс</button>
            </div>

            <div class="case-card">
                <h2 style="font-size: 17px; margin-bottom: 4px;" id="case-title">Подарочный кейс</h2>
                <p style="font-size: 11px; color: #a1a1aa; margin-bottom: 8px;" id="case-desc">Испытай удачу и выиграй эксклюзивный подарок!</p>
                
                <!-- Обычная рулетка (для одиночных кейсов) -->
                <div class="roulette-container" id="single-roulette-box">
                    <div class="roulette-pointer"></div>
                    <div class="roulette-track" id="roulette-track"></div>
                </div>

                <!-- Блок дуэли: две раздельные рулетки (Ваша и Соперника) -->
                <div id="duel-arena-box" style="display: none;">
                    <div style="font-size: 12px; color: #a78bfa; text-align: left; margin-bottom: 2px;">🟢 Ваша рулетка:</div>
                    <div class="roulette-container">
                        <div class="roulette-pointer"></div>
                        <div class="roulette-track" id="my-roulette-track"></div>
                    </div>

                    <div style="font-size: 12px; color: #ef4444; text-align: left; margin-top: 6px; margin-bottom: 2px;" id="opponent-label-box">🔴 Рулетка соперника:</div>
                    <div class="roulette-container">
                        <div class="roulette-pointer"></div>
                        <div class="roulette-track" id="opponent-roulette-track"></div>
                    </div>
                </div>

                <div id="duel-status-text" style="font-size: 13px; color: #a78bfa; margin: 10px 0; display: none;">Поиск противника (10с)...</div>
                <button class="btn" id="spin-btn" onclick="startSpin()">Крутить (25 ⭐)</button>
            </div>
        </div>

        <div class="screen" id="screen-inventory">
            <h2 style="margin-bottom: 12px; font-size: 18px;">Ваш инвентарь</h2>
            <div class="inventory-grid" id="inventory-grid">
                <div class="empty-inv">Инвентарь пока пуст. Откройте кейс!</div>
            </div>
        </div>

        <div class="screen" id="screen-referral">
            <div class="profile-card"><h2>👥 Пригласи друзей</h2></div>
        </div>

        <div class="screen" id="screen-profile">
            <div class="profile-card"><h2>👤 Профиль игрока</h2></div>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn active" onclick="switchScreen('main', this)">🎁 Кейсы</button>
        <button class="nav-btn" onclick="switchScreen('inventory', this)">🎒 Инвентарь<div class="badge-dot" id="inventory-badge"></div></button>
        <button class="nav-btn" onclick="switchScreen('referral', this)">👥 Друзья</button>
        <button class="nav-btn" onclick="switchScreen('profile', this)">👤 Профиль</button>
    </div>

    <div class="modal-overlay" id="result-modal">
        <div class="modal-card">
            <div style="font-size:48px;" id="modal-icon">🎁</div>
            <div style="font-size:17px; font-weight:600; margin-top:6px;" id="modal-title">Поздравляем!</div>
            <div style="font-size:12px; color:#a1a1aa; margin:10px 0;" id="modal-desc">Вы выиграли подарок!</div>
            <button class="btn" onclick="closeModal()">Забрать</button>
        </div>
    </div>
</div>

<script>
    const socket = io('https://telegram-duel-server-t0w9.onrender.com');

    let userId = localStorage.getItem('tg_user_id') || 'user_' + Math.floor(Math.random() * 1000000);
    localStorage.setItem('tg_user_id', userId);
    let username = localStorage.getItem('tg_username') || 'Игрок_' + userId.slice(-4);
    let userStars = parseInt(localStorage.getItem('tg_stars') || '50');
    let inventory = JSON.parse(localStorage.getItem('tg_inventory') || '[]');
    let currentMode = 'paid';
    let isSpinning = false;

    const giftsData = [
        { name: "Духи", icon: "💐", price: 10 },
        { name: "Сердце", icon: "💖", price: 25 },
        { name: "Торт", icon: "🎂", price: 50 },
        { name: "Кольцо", icon: "💍", price: 100 },
        { name: "Бриллиант", icon: "💎", price: 250 },
        { name: "Корона", icon: "👑", price: 500 }
    ];

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('user-stars').innerText = userStars;
        document.getElementById('header-username').innerText = '🎁 ' + username;
        buildTrack('roulette-track');
        renderInventory();
    });

    function switchRouletteMode(mode) {
        if (isSpinning) return;
        currentMode = mode;
        document.querySelectorAll('.switch-tab').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + mode).classList.add('active');

        const spinBtn = document.getElementById('spin-btn');
        const duelStatus = document.getElementById('duel-status-text');
        const singleBox = document.getElementById('single-roulette-box');
        const duelBox = document.getElementById('duel-arena-box');

        if (mode === 'paid' || mode === 'free') {
            document.getElementById('case-title').innerText = mode === 'paid' ? 'Подарочный кейс' : 'FREE Кейс';
            spinBtn.innerText = mode === 'paid' ? 'Крутить (25 ⭐)' : 'Крутить Бесплатно';
            singleBox.style.display = 'block';
            duelBox.style.display = 'none';
            duelStatus.style.display = 'none';
            buildTrack('roulette-track');
        } else if (mode === 'duel') {
            document.getElementById('case-title').innerText = 'PvP Дуэль (25 ⭐)';
            spinBtn.innerText = 'Найти дуэль (25 ⭐)';
            singleBox.style.display = 'none';
            duelBox.style.display = 'block';
            duelStatus.style.display = 'none';
            buildTrack('my-roulette-track');
            buildTrack('opponent-roulette-track');
        }
    }

    function buildTrack(elementId, targetGift = null) {
        const track = document.getElementById(elementId);
        if (!track) return;
        track.style.transition = 'none';
        track.style.transform = 'translateX(0px)';
        track.innerHTML = '';
        
        let html = '';
        for (let i = 0; i < 40; i++) {
            let gift = giftsData[Math.floor(Math.random() * giftsData.length)];
            if (i === 25 && targetGift) gift = targetGift;
            html += `<div class="roulette-item">${gift.icon}<span class="label">${gift.price}⭐</span></div>`;
        }
        track.innerHTML = html;
    }

    function startSpin() {
        if (isSpinning) return;

        if (currentMode === 'paid' || currentMode === 'duel') {
            if (userStars < 25) {
                alert('Недостаточно звездочек!');
                return;
            }
            userStars -= 25;
            updateBalance();
        }

        if (currentMode === 'duel') {
            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;
            document.getElementById('duel-status-text').style.display = 'block';
            document.getElementById('duel-status-text').innerText = 'Поиск противника (10с)...';
            socket.emit('find_duel', { userId, username, bet: 25 });
            return;
        }

        executeSingleSpin(giftsData[Math.floor(Math.random() * giftsData.length)]);
    }

    // Обработчик старта дуэли от сервера с двумя рулетками
    socket.on('duel_started', (data) => {
        document.getElementById('duel-status-text').innerText = `Соперник найден: ${data.opponentName}! Вращение...`;
        document.getElementById('opponent-label-box').innerText = `🔴 Рулетка соперника (${data.opponentName}):`;

        // Заполняем треки с фиксированными победными подарками на позиции 25
        buildTrack('my-roulette-track', data.myGift);
        buildTrack('opponent-roulette-track', data.opponentGift);

        setTimeout(() => {
            const itemWidth = 75;
            const targetIndex = 25;
            const distance = -(targetIndex * itemWidth) + 140;

            // Запускаем обе рулетки одновременно
            const myTrack = document.getElementById('my-roulette-track');
            const oppTrack = document.getElementById('opponent-roulette-track');

            myTrack.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.15, 1)';
            myTrack.style.transform = `translateX(${distance}px)`;

            oppTrack.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.15, 1)';
            oppTrack.style.transform = `translateX(${distance}px)`;
        }, 100);

        setTimeout(() => {
            isSpinning = false;
            document.getElementById('spin-btn').disabled = false;
            document.getElementById('duel-status-text').style.display = 'none';

            if (data.isWinner) {
                inventory.push(data.myGift);
                saveInventory();
                showModal(data.myGift.icon, 'Победа в Дуэли! 🎉', `Вы переиграли соперника и забрали ${data.myGift.name} (${data.myGift.price}⭐)!`);
            } else {
                showModal('💀', 'Поражение!', `Соперник (${data.opponentName}) оказался удачливее и выиграл раунд.`);
            }
        }, 4300);
    });

    function executeSingleSpin(winningGift) {
        isSpinning = true;
        document.getElementById('spin-btn').disabled = true;
        buildTrack('roulette-track', winningGift);

        const track = document.getElementById('roulette-track');
        const itemWidth = 75;
        const distance = -(25 * itemWidth) + 140;

        setTimeout(() => {
            track.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.15, 1)';
            track.style.transform = `translateX(${distance}px)`;
        }, 50);

        setTimeout(() => {
            isSpinning = false;
            document.getElementById('spin-btn').disabled = false;
            inventory.push(winningGift);
            saveInventory();
            showModal(winningGift.icon, 'Поздравляем!', `Вы выиграли ${winningGift.name} (${winningGift.price}⭐)!`);
        }, 4200);
    }

    function updateBalance() {
        document.getElementById('user-stars').innerText = userStars;
        localStorage.setItem('tg_stars', userStars);
    }

    function saveInventory() {
        localStorage.setItem('tg_inventory', JSON.stringify(inventory));
        renderInventory();
    }

    function renderInventory() {
        const grid = document.getElementById('inventory-grid');
        if (inventory.length === 0) {
            grid.innerHTML = '<div class="empty-inv">Инвентарь пока пуст. Откройте кейс!</div>';
            return;
        }
        let html = '';
        inventory.forEach((item) => {
            html += `<div class="inventory-item">${item.icon}<span class="item-name">${item.name} (${item.price}⭐)</span></div>`;
        });
        grid.innerHTML = html;
    }

    function showModal(icon, title, desc) {
        document.getElementById('modal-icon').innerText = icon;
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-desc').innerText = desc;
        document.getElementById('result-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('result-modal').style.display = 'none';
    }

    function switchScreen(screenName, btnEl) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('screen-' + screenName).classList.add('active');
        btnEl.classList.add('active');
    }
</script>
</body>
</html>
